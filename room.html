<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taro · Voxel Room</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #f0e0cc; }
  canvas { display: block; }
</style>
</head>
<body>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf0dcc8);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

const aspect = window.innerWidth / window.innerHeight;
const d = 7;
const camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 0.1, 100);
camera.position.set(10, 10, 10);
camera.lookAt(0, 0, 0);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enablePan = false;
controls.enableZoom = true;
controls.minZoom = 0.5;
controls.maxZoom = 2;
controls.target.set(0, 2, 0);
controls.update();

const ambientLight = new THREE.AmbientLight(0xfff5e6, 0.6);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xffeedd, 1.2);
dirLight.position.set(8, 12, 6);
dirLight.castShadow = true;
dirLight.shadow.mapSize.set(2048, 2048);
dirLight.shadow.camera.left = -10;
dirLight.shadow.camera.right = 10;
dirLight.shadow.camera.top = 10;
dirLight.shadow.camera.bottom = -10;
dirLight.shadow.camera.near = 0.1;
dirLight.shadow.camera.far = 30;
dirLight.shadow.bias = -0.002;
dirLight.shadow.radius = 3;
scene.add(dirLight);

const fillLight = new THREE.DirectionalLight(0xc8b8ff, 0.3);
fillLight.position.set(-6, 8, -4);
scene.add(fillLight);

const warmGlow = new THREE.PointLight(0xffaa44, 0.5, 12);
warmGlow.position.set(-1, 3, -1);
scene.add(warmGlow);

const mat = {
  wallLeft:    new THREE.MeshStandardMaterial({ color: 0x7b5ea7, roughness: 0.85 }),
  wallRight:   new THREE.MeshStandardMaterial({ color: 0x8b6eb7, roughness: 0.85 }),
  wallTrim:    new THREE.MeshStandardMaterial({ color: 0xc8b0e8, roughness: 0.7 }),
  floor:       new THREE.MeshStandardMaterial({ color: 0xf5e6d0, roughness: 0.9 }),
  floorAlt:    new THREE.MeshStandardMaterial({ color: 0xe8d5b8, roughness: 0.9 }),
  wood:        new THREE.MeshStandardMaterial({ color: 0x8b6b4a, roughness: 0.7 }),
  woodDark:    new THREE.MeshStandardMaterial({ color: 0x6b4c30, roughness: 0.75 }),
  woodLight:   new THREE.MeshStandardMaterial({ color: 0xc49a6c, roughness: 0.65 }),
  carpet:      new THREE.MeshStandardMaterial({ color: 0x2d5a4a, roughness: 0.95 }),
  cushion:     new THREE.MeshStandardMaterial({ color: 0x9b3b6e, roughness: 0.9 }),
  cushionGold: new THREE.MeshStandardMaterial({ color: 0xd4a64f, roughness: 0.85 }),
  crystal1:    new THREE.MeshStandardMaterial({ color: 0xcc88ff, roughness: 0.2, metalness: 0.3 }),
  crystal2:    new THREE.MeshStandardMaterial({ color: 0x88ccff, roughness: 0.2, metalness: 0.3 }),
  crystal3:    new THREE.MeshStandardMaterial({ color: 0xff88cc, roughness: 0.2, metalness: 0.3 }),
  candle:      new THREE.MeshStandardMaterial({ color: 0xf5e8d0, roughness: 0.6 }),
  flame:       new THREE.MeshStandardMaterial({ color: 0xffaa33, emissive: 0xff8800, emissiveIntensity: 1.5, roughness: 0.3 }),
  gold:        new THREE.MeshStandardMaterial({ color: 0xd4a64f, roughness: 0.3, metalness: 0.7 }),
  book1:       new THREE.MeshStandardMaterial({ color: 0x8b2252, roughness: 0.8 }),
  book2:       new THREE.MeshStandardMaterial({ color: 0x2a4858, roughness: 0.8 }),
  book3:       new THREE.MeshStandardMaterial({ color: 0x6b3a8a, roughness: 0.8 }),
  book4:       new THREE.MeshStandardMaterial({ color: 0xcc8833, roughness: 0.8 }),
  book5:       new THREE.MeshStandardMaterial({ color: 0x3a5a2a, roughness: 0.8 }),
  black:       new THREE.MeshStandardMaterial({ color: 0x2a2030, roughness: 0.8 }),
  screen:      new THREE.MeshStandardMaterial({ color: 0x1a1830, emissive: 0x332266, emissiveIntensity: 0.3, roughness: 0.3 }),
  tarot:       new THREE.MeshStandardMaterial({ color: 0x1a0a30, roughness: 0.6 }),
  tarotGold:   new THREE.MeshStandardMaterial({ color: 0xd4a64f, emissive: 0xaa8833, emissiveIntensity: 0.2, roughness: 0.4 }),
  moonFrame:   new THREE.MeshStandardMaterial({ color: 0xd4a64f, roughness: 0.4, metalness: 0.5 }),
  starDeco:    new THREE.MeshStandardMaterial({ color: 0xffd700, emissive: 0xffaa00, emissiveIntensity: 0.5, roughness: 0.3, metalness: 0.5 }),
  potPurple:   new THREE.MeshStandardMaterial({ color: 0x6a3d7d, roughness: 0.7 }),
  plantGreen:  new THREE.MeshStandardMaterial({ color: 0x4a8a3a, roughness: 0.8 }),
  plantDark:   new THREE.MeshStandardMaterial({ color: 0x2a5a2a, roughness: 0.8 }),
  couch:       new THREE.MeshStandardMaterial({ color: 0xddd8cc, roughness: 0.85 }),
  couchSide:   new THREE.MeshStandardMaterial({ color: 0xc8c0b0, roughness: 0.85 }),
  door:        new THREE.MeshStandardMaterial({ color: 0x9a7550, roughness: 0.6 }),
  doorHandle:  new THREE.MeshStandardMaterial({ color: 0xd4a64f, roughness: 0.3, metalness: 0.8 }),
  windowFrame: new THREE.MeshStandardMaterial({ color: 0xc49a6c, roughness: 0.6 }),
  windowGlass: new THREE.MeshStandardMaterial({ color: 0xddeeff, roughness: 0.1, metalness: 0.1, transparent: true, opacity: 0.4 }),
  windowLight: new THREE.MeshStandardMaterial({ color: 0xfff8e0, emissive: 0xfff0c0, emissiveIntensity: 0.3, transparent: true, opacity: 0.5 }),
  rugPattern:  new THREE.MeshStandardMaterial({ color: 0xd4a64f, roughness: 0.9 }),
  incense:     new THREE.MeshStandardMaterial({ color: 0x4a3020, roughness: 0.9 }),
  smoke:       new THREE.MeshStandardMaterial({ color: 0xccbbaa, transparent: true, opacity: 0.2, roughness: 1 }),
};

function box(w, h, dp, material) {
  const geo = new THREE.BoxGeometry(w, h, dp);
  const mesh = new THREE.Mesh(geo, material);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

const ROOM = 8, WALL_H = 6, WALL_T = 0.4;
const room = new THREE.Group();

// Floor
for (let x = 0; x < ROOM; x++) {
  for (let z = 0; z < ROOM; z++) {
    const tile = box(0.98, 0.3, 0.98, (x + z) % 2 === 0 ? mat.floor : mat.floorAlt);
    tile.position.set(x - ROOM / 2 + 0.5, -0.15, z - ROOM / 2 + 0.5);
    room.add(tile);
  }
}

// Walls
const wL = box(ROOM, WALL_H, WALL_T, mat.wallLeft);
wL.position.set(0, WALL_H / 2, -ROOM / 2 + WALL_T / 2); room.add(wL);
const wR = box(WALL_T, WALL_H, ROOM, mat.wallRight);
wR.position.set(-ROOM / 2 + WALL_T / 2, WALL_H / 2, 0); room.add(wR);

// Trim top
const tL = box(ROOM + 0.1, 0.25, WALL_T + 0.15, mat.wallTrim);
tL.position.set(0, WALL_H + 0.12, -ROOM / 2 + WALL_T / 2); room.add(tL);
const tR = box(WALL_T + 0.15, 0.25, ROOM + 0.1, mat.wallTrim);
tR.position.set(-ROOM / 2 + WALL_T / 2, WALL_H + 0.12, 0); room.add(tR);

// Baseboard
const bL = box(ROOM, 0.3, 0.15, mat.wallTrim);
bL.position.set(0, 0.15, -ROOM / 2 + WALL_T + 0.07); room.add(bL);
const bR = box(0.15, 0.3, ROOM, mat.wallTrim);
bR.position.set(-ROOM / 2 + WALL_T + 0.07, 0.15, 0); room.add(bR);

// ─── Window ───
function createWindow(x, y) {
  const g = new THREE.Group();
  for (const [w,h2,dp,px,py] of [[1.8,0.15,0.2,0,0.9],[1.8,0.15,0.2,0,-0.9],[0.15,1.95,0.2,-0.82,0],[0.15,1.95,0.2,0.82,0],[0.1,1.95,0.15,0,0]]) {
    const m = box(w,h2,dp,mat.windowFrame); m.position.set(px,py,0); g.add(m);
  }
  const gl = box(1.6,1.7,0.05,mat.windowGlass); gl.position.set(0,0,-0.05); g.add(gl);
  const gw = box(1.6,1.7,0.02,mat.windowLight); gw.position.set(0,0,-0.1); g.add(gw);
  g.position.set(x, y, -ROOM/2+WALL_T+0.05);
  return g;
}
room.add(createWindow(2, 3.5));

// ─── Door ───
function createDoor() {
  const g = new THREE.Group();
  const dp = box(1.5,3,0.2,mat.door); dp.position.set(0,1.5,0); g.add(dp);
  const ft = box(1.8,0.15,0.25,mat.woodDark); ft.position.set(0,3.07,0); g.add(ft);
  const fl = box(0.15,3.15,0.25,mat.woodDark); fl.position.set(-0.82,1.5,0); g.add(fl);
  const fr = box(0.15,3.15,0.25,mat.woodDark); fr.position.set(0.82,1.5,0); g.add(fr);
  const h2 = box(0.08,0.25,0.12,mat.doorHandle); h2.position.set(0.5,1.5,0.15); g.add(h2);
  const pt = box(1.0,0.8,0.05,mat.woodDark); pt.position.set(0,2.2,0.12); g.add(pt);
  const pb = box(1.0,1.0,0.05,mat.woodDark); pb.position.set(0,0.7,0.12); g.add(pb);
  g.position.set(-ROOM/2+WALL_T+0.05, 0, -0.5);
  g.rotation.y = Math.PI/2;
  return g;
}
room.add(createDoor());

// ─── Bookshelf ───
function createBookshelf(x, z) {
  const g = new THREE.Group();
  const bk = box(2.2,3,0.15,mat.woodDark); bk.position.set(0,1.5,-0.3); g.add(bk);
  const sl = box(0.15,3,0.7,mat.wood); sl.position.set(-1.02,1.5,0); g.add(sl);
  const sr = box(0.15,3,0.7,mat.wood); sr.position.set(1.02,1.5,0); g.add(sr);
  const tp = box(2.35,0.12,0.7,mat.wood); tp.position.set(0,3,0); g.add(tp);
  for (let i=0;i<3;i++) { const s=box(2.05,0.1,0.65,mat.wood); s.position.set(0,0.75+i*0.95,0.02); g.add(s); }
  const bm=[mat.book1,mat.book2,mat.book3,mat.book4,mat.book5];
  for (let row=0;row<3;row++) {
    const y=0.8+row*0.95; let bx=-0.8;
    for (let b=0;b<5+Math.floor(Math.random()*3);b++) {
      const bw=0.12+Math.random()*0.08, bh=0.55+Math.random()*0.25;
      const book=box(bw,bh,0.4,bm[b%bm.length]);
      book.position.set(bx+bw/2,y+bh/2,0.05); g.add(book);
      bx+=bw+0.02; if(bx>0.8) break;
    }
  }
  g.position.set(x,0,z); return g;
}
room.add(createBookshelf(-2.2, -ROOM/2+WALL_T+0.35));

// ─── Crystals ───
function createCrystals(x,y,z) {
  const g=new THREE.Group();
  for (const c of [
    {h:0.6,r:0.1,m:mat.crystal1,rx:0.1,rz:0,px:0,pz:0},
    {h:0.45,r:0.08,m:mat.crystal2,rx:-0.15,rz:0.2,px:0.15,pz:0.08},
    {h:0.35,r:0.07,m:mat.crystal3,rx:0.2,rz:-0.1,px:-0.12,pz:0.1},
    {h:0.5,r:0.09,m:mat.crystal1,rx:-0.1,rz:-0.15,px:-0.05,pz:-0.12},
    {h:0.3,r:0.06,m:mat.crystal2,rx:0.15,rz:0.1,px:0.1,pz:-0.08},
  ]) {
    const mesh=new THREE.Mesh(new THREE.CylinderGeometry(0,c.r,c.h,6),c.m);
    mesh.position.set(c.px,c.h/2,c.pz); mesh.rotation.x=c.rx; mesh.rotation.z=c.rz;
    mesh.castShadow=true; g.add(mesh);
  }
  const base=new THREE.Mesh(new THREE.DodecahedronGeometry(0.2,0),mat.woodDark);
  base.position.set(0,0.05,0); base.scale.set(1,0.4,1); base.castShadow=true; g.add(base);
  g.position.set(x,y,z); return g;
}

// ─── Candle ───
function createCandle(x,y,z,height=0.5) {
  const g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.08,height,8),mat.candle);
  body.position.set(0,height/2,0); body.castShadow=true; g.add(body);
  const fm=new THREE.Mesh(new THREE.ConeGeometry(0.04,0.12,6),mat.flame);
  fm.position.set(0,height+0.06,0); fm.userData.isFlame=true; g.add(fm);
  const cl=new THREE.PointLight(0xff8833,0.4,3);
  cl.position.set(0,height+0.15,0); g.add(cl);
  g.position.set(x,y,z); return g;
}

// ─── Wall shelf ───
function createWallShelf(x,y,side) {
  const g=new THREE.Group();
  g.add(box(1.8,0.1,0.5,mat.wood));
  const bl=box(0.08,0.3,0.4,mat.woodDark); bl.position.set(-0.7,-0.2,0); g.add(bl);
  const br=box(0.08,0.3,0.4,mat.woodDark); br.position.set(0.7,-0.2,0); g.add(br);
  g.add(createCrystals(-0.4,0.05,0.05));
  g.add(createCandle(0.3,0.05,0,0.35));
  g.add(createCandle(0.6,0.05,0,0.25));
  if(side==='back') { g.position.set(x,y,-ROOM/2+WALL_T+0.25); }
  else { g.position.set(-ROOM/2+WALL_T+0.25,y,x); g.rotation.y=Math.PI/2; }
  return g;
}
room.add(createWallShelf(-1,4.5,'left'));

// ─── Moon decor ───
function createMoonDecor(x,y) {
  const g=new THREE.Group();
  const ring=new THREE.Mesh(new THREE.TorusGeometry(0.5,0.06,8,24),mat.moonFrame);
  ring.rotation.x=Math.PI/2; g.add(ring);
  const mo=new THREE.Mesh(new THREE.CircleGeometry(0.4,16),mat.gold);
  mo.rotation.y=Math.PI; g.add(mo);
  const mc=new THREE.Mesh(new THREE.CircleGeometry(0.32,16),mat.wallLeft);
  mc.position.set(0.12,0.05,0.01); mc.rotation.y=Math.PI; g.add(mc);
  g.position.set(x,y,-ROOM/2+WALL_T+0.08); return g;
}
room.add(createMoonDecor(-0.5,4.8));

// ─── Stars ───
function createStar(x,y,z,size=0.15) {
  const shape=new THREE.Shape();
  for(let i=0;i<10;i++) {
    const a=(i*Math.PI)/5-Math.PI/2, r=i%2===0?size:size*0.4;
    if(i===0) shape.moveTo(Math.cos(a)*r,Math.sin(a)*r);
    else shape.lineTo(Math.cos(a)*r,Math.sin(a)*r);
  }
  shape.closePath();
  const mesh=new THREE.Mesh(new THREE.ExtrudeGeometry(shape,{depth:0.04,bevelEnabled:false}),mat.starDeco);
  mesh.position.set(x,y,z); mesh.castShadow=true; return mesh;
}
room.add(createStar(1.5,5,-ROOM/2+WALL_T+0.05,0.15));
room.add(createStar(0.5,5.3,-ROOM/2+WALL_T+0.05,0.1));
room.add(createStar(2.8,4.5,-ROOM/2+WALL_T+0.05,0.12));

// ─── Tarot table ───
function createTarotTable() {
  const g=new THREE.Group();
  const top=box(2,0.12,1.2,mat.woodLight); top.position.set(0,1,0); g.add(top);
  for(const[lx,lz] of [[-0.8,-0.45],[0.8,-0.45],[-0.8,0.45],[0.8,0.45]]) {
    const leg=box(0.12,1,0.12,mat.wood); leg.position.set(lx,0.5,lz); g.add(leg);
  }
  for(let i=0;i<3;i++) {
    const card=box(0.35,0.03,0.55,mat.tarot);
    card.position.set(-0.5+i*0.5,1.08,-0.1+(i===1?0.1:0)); card.rotation.y=(i-1)*0.15; g.add(card);
    const border=box(0.37,0.02,0.57,mat.tarotGold);
    border.position.set(-0.5+i*0.5,1.06,-0.1+(i===1?0.1:0)); border.rotation.y=(i-1)*0.15; g.add(border);
  }
  g.position.set(1,0,0.5); return g;
}
room.add(createTarotTable());

// ─── Cushion ───
function createCushion(x,z) {
  const g=new THREE.Group();
  const base=new THREE.Mesh(new THREE.CylinderGeometry(0.45,0.5,0.2,8),mat.cushion);
  base.position.set(0,0.1,0); base.castShadow=true; base.receiveShadow=true; g.add(base);
  const tp=new THREE.Mesh(new THREE.CylinderGeometry(0.35,0.45,0.12,8),mat.cushionGold);
  tp.position.set(0,0.26,0); tp.castShadow=true; g.add(tp);
  g.position.set(x,0,z); return g;
}
room.add(createCushion(1,2));

// ─── Couch ───
function createCouch() {
  const g=new THREE.Group();
  const seat=box(2.5,0.5,1.2,mat.couch); seat.position.set(0,0.4,0); g.add(seat);
  const back=box(2.5,0.7,0.3,mat.couchSide); back.position.set(0,1,-0.45); g.add(back);
  const aL=box(0.3,0.5,1.2,mat.couchSide); aL.position.set(-1.25,0.55,0); g.add(aL);
  const aR=box(0.3,0.5,1.2,mat.couchSide); aR.position.set(1.25,0.55,0); g.add(aR);
  const p1=box(0.6,0.25,0.45,mat.cushion); p1.position.set(-0.7,0.78,-0.15); p1.rotation.z=0.15; g.add(p1);
  const p2=box(0.6,0.25,0.45,mat.cushionGold); p2.position.set(0.5,0.78,-0.2); p2.rotation.z=-0.1; g.add(p2);
  g.position.set(0.5,0,2.8); return g;
}
room.add(createCouch());

// ─── Rug ───
function createRug() {
  const g=new THREE.Group();
  const base2=box(3.5,0.04,2.5,mat.carpet); base2.position.set(0,0.02,0); g.add(base2);
  for(const[w,h2,dp,px,pz] of [[3.3,0.045,0.1,0,-1.1],[3.3,0.045,0.1,0,1.1],[0.1,0.045,2.3,-1.55,0],[0.1,0.045,2.3,1.55,0]]) {
    const b=box(w,h2,dp,mat.rugPattern); b.position.set(px,0.03,pz); g.add(b);
  }
  const c=new THREE.Mesh(new THREE.CircleGeometry(0.4,8),mat.rugPattern);
  c.rotation.x=-Math.PI/2; c.position.set(0,0.05,0); g.add(c);
  g.position.set(0.8,0,1.5); return g;
}
room.add(createRug());

// ─── Side table ───
function createSideTable(x,z) {
  const g=new THREE.Group();
  const top=box(0.7,0.08,0.7,mat.woodDark); top.position.set(0,0.8,0); g.add(top);
  const leg=box(0.12,0.8,0.12,mat.wood); leg.position.set(0,0.4,0); g.add(leg);
  const bb=box(0.5,0.08,0.5,mat.wood); bb.position.set(0,0.04,0); g.add(bb);
  g.add(createCandle(0.15,0.84,0.1,0.4));
  g.add(createCandle(-0.15,0.84,-0.1,0.55));
  g.position.set(x,0,z); return g;
}
room.add(createSideTable(-2.5,2.5));

// ─── Incense ───
function createIncense(x,y,z) {
  const g=new THREE.Group();
  const holder=box(0.5,0.06,0.12,mat.woodDark); holder.position.set(0,0.03,0); g.add(holder);
  const stick=new THREE.Mesh(new THREE.CylinderGeometry(0.015,0.015,0.6,4),mat.incense);
  stick.position.set(0.1,0.25,0); stick.rotation.z=-0.3; stick.castShadow=true; g.add(stick);
  for(let i=0;i<3;i++) {
    const s=box(0.04,0.04,0.04,mat.smoke);
    s.position.set(0.1+i*0.05,0.55+i*0.15,(Math.random()-0.5)*0.1);
    s.userData.isSmoke=true; s.userData.baseY=s.position.y; s.userData.offset=i*0.7; g.add(s);
  }
  g.position.set(x,y,z); return g;
}

// ─── Plant ───
function createPlant(x,z) {
  const g=new THREE.Group();
  const pot=new THREE.Mesh(new THREE.CylinderGeometry(0.25,0.18,0.4,8),mat.potPurple);
  pot.position.set(0,0.2,0); pot.castShadow=true; g.add(pot);
  const soil=new THREE.Mesh(new THREE.CylinderGeometry(0.23,0.23,0.05,8),mat.woodDark);
  soil.position.set(0,0.4,0); g.add(soil);
  for(const[lx,ly,lz] of [[0,0.6,0],[0.12,0.55,0.08],[-0.1,0.58,-0.08],[0.05,0.7,-0.05],[-0.08,0.65,0.06]]) {
    const leaf=box(0.15,0.2,0.15,Math.random()>0.4?mat.plantGreen:mat.plantDark);
    leaf.position.set(lx,ly,lz); leaf.rotation.y=Math.random()*Math.PI; g.add(leaf);
  }
  g.position.set(x,0,z); return g;
}
room.add(createPlant(3,-2.5));
room.add(createPlant(-3.2,3));

// ─── Desk ───
function createDesk() {
  const g=new THREE.Group();
  const top=box(1.8,0.1,0.9,mat.wood); top.position.set(0,1.3,0); g.add(top);
  for(const[lx,lz] of [[-0.75,-0.3],[0.75,-0.3],[-0.75,0.3],[0.75,0.3]]) {
    const leg=box(0.1,1.3,0.1,mat.woodDark); leg.position.set(lx,0.65,lz); g.add(leg);
  }
  const mb=box(1.2,0.8,0.06,mat.black); mb.position.set(0,1.9,-0.2); g.add(mb);
  const sf=box(1.1,0.7,0.02,mat.screen); sf.position.set(0,1.9,-0.15); g.add(sf);
  const st=box(0.15,0.3,0.15,mat.black); st.position.set(0,1.5,-0.2); g.add(st);
  const kb=box(0.7,0.04,0.25,mat.black); kb.position.set(0,1.37,0.15); g.add(kb);
  const cb=new THREE.Mesh(new THREE.SphereGeometry(0.15,16,16),
    new THREE.MeshStandardMaterial({color:0xaabbff,roughness:0.05,metalness:0.1,transparent:true,opacity:0.6}));
  cb.position.set(0.65,1.5,0.1); cb.castShadow=true; g.add(cb);
  const cbb=new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.15,0.06,8),mat.gold);
  cbb.position.set(0.65,1.37,0.1); g.add(cbb);
  g.add(createIncense(-0.6,1.35,0.2));
  g.position.set(2,0,-2.5); return g;
}
room.add(createDesk());

// ─── Chair ───
function createChair(x,z,rotY=0) {
  const g=new THREE.Group();
  const seat=box(0.6,0.08,0.6,mat.wood); seat.position.set(0,0.75,0); g.add(seat);
  for(const[lx,lz2] of [[-0.22,-0.22],[0.22,-0.22],[-0.22,0.22],[0.22,0.22]]) {
    const leg=box(0.08,0.75,0.08,mat.woodDark); leg.position.set(lx,0.375,lz2); g.add(leg);
  }
  const br=box(0.6,0.6,0.08,mat.wood); br.position.set(0,1.15,-0.26); g.add(br);
  const pad=box(0.5,0.08,0.5,mat.cushion); pad.position.set(0,0.83,0.02); g.add(pad);
  g.position.set(x,0,z); g.rotation.y=rotY; return g;
}
room.add(createChair(2,-1.2,Math.PI));

// ─── Floor candles ───
function createFloorCandle(x,z) {
  const g=new THREE.Group();
  const base=new THREE.Mesh(new THREE.CylinderGeometry(0.15,0.2,0.1,8),mat.gold);
  base.position.set(0,0.05,0); base.castShadow=true; g.add(base);
  const stem=new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.06,0.8,8),mat.gold);
  stem.position.set(0,0.5,0); stem.castShadow=true; g.add(stem);
  const cup=new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.04,0.1,8),mat.gold);
  cup.position.set(0,0.95,0); cup.castShadow=true; g.add(cup);
  g.add(createCandle(0,1,0,0.4));
  g.position.set(x,0,z); return g;
}
room.add(createFloorCandle(-3,-2));
room.add(createFloorCandle(3.2,1));

// Extras
const dRug=box(1.5,0.03,1,mat.cushion); dRug.position.set(2,0.015,-1.5); room.add(dRug);
room.add(createCrystals(-1.8,3.1,-ROOM/2+WALL_T+0.5));

scene.add(room);

// ─── Particles ───
const particles=[];
const pGeo=new THREE.BoxGeometry(0.03,0.03,0.03);
const pMat=new THREE.MeshStandardMaterial({color:0xffd700,emissive:0xffaa00,emissiveIntensity:0.8,transparent:true,opacity:0.6});
for(let i=0;i<20;i++) {
  const p=new THREE.Mesh(pGeo,pMat.clone());
  p.position.set((Math.random()-0.5)*6,1+Math.random()*4,(Math.random()-0.5)*6);
  p.userData.baseY=p.position.y; p.userData.speed=0.3+Math.random()*0.5;
  p.userData.offset=Math.random()*Math.PI*2;
  p.userData.driftX=(Math.random()-0.5)*0.5; p.userData.driftZ=(Math.random()-0.5)*0.5;
  scene.add(p); particles.push(p);
}

const flames=[],smokePs=[];
scene.traverse(c=>{if(c.userData.isFlame)flames.push(c);if(c.userData.isSmoke)smokePs.push(c);});

const clock=new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t=clock.getElapsedTime();
  for(const f of flames) {
    f.scale.set(0.8+Math.sin(t*8+f.id)*0.2,0.8+Math.sin(t*6+f.id*0.7)*0.3,0.8+Math.cos(t*7+f.id*0.5)*0.2);
    f.position.x+=Math.sin(t*10+f.id)*0.001;
  }
  for(const s of smokePs) {
    s.position.y=s.userData.baseY+Math.sin(t*0.8+s.userData.offset)*0.15;
    s.position.x+=Math.sin(t*0.5+s.userData.offset)*0.001;
    s.material.opacity=0.1+Math.sin(t*0.6+s.userData.offset)*0.1;
  }
  for(const p of particles) {
    const o=p.userData.offset;
    p.position.y=p.userData.baseY+Math.sin(t*p.userData.speed+o)*0.5;
    p.position.x+=Math.sin(t*0.3+o)*0.002*p.userData.driftX;
    p.position.z+=Math.cos(t*0.3+o)*0.002*p.userData.driftZ;
    p.material.opacity=0.3+Math.sin(t*1.5+o)*0.3;
    p.rotation.y=t*0.5+o;
  }
  warmGlow.intensity=0.4+Math.sin(t*2)*0.15;
  controls.update();
  renderer.render(scene,camera);
}
animate();

window.addEventListener('resize',()=>{
  const w=window.innerWidth,h=window.innerHeight,a=w/h;
  camera.left=-d*a; camera.right=d*a; camera.top=d; camera.bottom=-d;
  camera.updateProjectionMatrix(); renderer.setSize(w,h);
});
</script>
