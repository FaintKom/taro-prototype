<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taro · Astrology App</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Cinzel:wght@400;500;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --serif: 'Cormorant Garamond', 'Iowan Old Style', Georgia, serif;
    --display: 'Cinzel', 'Trajan Pro', 'Cormorant Garamond', serif;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    --bg-deep: #0a0618; --bg-mid: #15102a; --bg-card: #1a1430; --bg-elev: #221a3d;
    --ink: #f5efe2; --ink-soft: #b8aed0; --ink-dim: #756a90;
    --gold: #d4a64f; --gold-soft: #c8a96d; --amber: #e8b76d;
    --violet: #a87fd6; --rose: #d97a99; --good: #8ec48a;
    --line: #2c2548; --line-soft: #1f1a36;
    --font-scale: 1;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; background: #050309; }
  body { font-family: var(--sans); color: var(--ink); font-size: calc(14px * var(--font-scale)); -webkit-font-smoothing: antialiased; }
  button { background: none; border: none; cursor: pointer; font: inherit; color: inherit; padding: 0; }
  input, textarea { font: inherit; color: var(--ink); }
  .serif { font-family: var(--serif); }
  .display { font-family: var(--display); letter-spacing: 0.08em; font-weight: 500; }
  .eyebrow { font-family: var(--display); letter-spacing: 0.32em; text-transform: uppercase; font-weight: 500; font-size: 10px; color: var(--gold); }
  .no-scroll::-webkit-scrollbar { display: none; }
  .no-scroll { scrollbar-width: none; -ms-overflow-style: none; }
  .card { background: var(--bg-card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; margin-bottom: 12px; }
  .input { width: 100%; background: var(--bg-card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; color: var(--ink); font-size: 15px; outline: none; transition: border-color .2s; }
  .input:focus { border-color: var(--gold); }
  .btn-primary { background: linear-gradient(180deg, var(--gold), color-mix(in srgb, var(--gold) 75%, #000)); color: #1a1530; font-weight: 600; padding: 14px 20px; border-radius: 999px; font-size: 14px; letter-spacing: 0.05em; box-shadow: 0 6px 18px rgba(212,166,79,.25); transition: transform .1s; }
  .btn-primary:active { transform: scale(.98); }
  .btn-primary:disabled { opacity: .4; }
  .btn-ghost { background: var(--bg-card); border: 1px solid var(--line); color: var(--ink-soft); padding: 12px 16px; border-radius: 999px; font-size: 13px; }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .fade-up { animation: fadeUp .4s ease-out both; }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .slide-up { animation: slideUp .3s cubic-bezier(.2,.9,.2,1); }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse-soft { 0%,100% { transform: translateX(0) scale(1); } 50% { transform: translateX(8px) scale(1.04); } }
  @keyframes pulse-soft-rev { 0%,100% { transform: translateX(0) scale(1); } 50% { transform: translateX(-8px) scale(1.04); } }
  @keyframes moonShine { 0%,100% { filter: drop-shadow(0 0 12px rgba(212,166,79,.4)); } 50% { filter: drop-shadow(0 0 24px rgba(212,166,79,.7)); } }
  @keyframes cardGlow { 0%,100% { filter: drop-shadow(0 0 0 rgba(212,166,79,0)); } 50% { filter: drop-shadow(0 0 14px rgba(212,166,79,.5)); } }
  @keyframes shuffle1 { 0%,100% { transform: translate(0,0) rotate(-6deg); } 50% { transform: translate(-30px,-10px) rotate(-18deg); } }
  @keyframes shuffle2 { 0%,100% { transform: translate(0,0) rotate(0); } 50% { transform: translate(0,-20px) rotate(0); } }
  @keyframes shuffle3 { 0%,100% { transform: translate(0,0) rotate(6deg); } 50% { transform: translate(30px,-10px) rotate(18deg); } }
  @keyframes coinFly { 0% { transform: translate(0,0) scale(1); opacity: 1; } 100% { transform: translate(var(--toX), var(--toY)) scale(.6); opacity: 0; } }
  @keyframes twinkle { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
  .typing-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin: 0 2px; opacity: .6; animation: typing 1.2s infinite; }
  .typing-dot:nth-child(2) { animation-delay: .15s; }
  .typing-dot:nth-child(3) { animation-delay: .3s; }
  @keyframes typing { 0%,100% { transform: translateY(0); opacity: .4; } 50% { transform: translateY(-3px); opacity: 1; } }

  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #050309; }
  #stage::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at 20% 30%, rgba(168,127,214,.05), transparent 50%), radial-gradient(ellipse at 80% 70%, rgba(212,166,79,.03), transparent 50%); pointer-events: none; }
</style>
</head>
<body>

<div id="stage">
  <div id="phone-wrap" style="position: relative;"></div>
</div>

<script>
  window.TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "cardStyle": "occult",
    "gold": "#d4a64f",
    "bgDeep": "#1d0e2a",
    "bgCard": "#2a1840",
    "fontScale": 1.2,
    "darkness": "plum"
  }/*EDITMODE-END*/;

  function scaleStage() {
    const w = window.innerWidth, h = window.innerHeight;
    const fw = 430, fh = 900;
    const s = Math.min(w / fw, h / fh, 1) * 0.96;
    const wrap = document.getElementById('phone-wrap');
    if (wrap) wrap.style.transform = `scale(${s})`;
  }
  window.scaleStage = scaleStage;
  window.addEventListener('resize', scaleStage);
</script>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="android-frame.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="atoms.jsx"></script>
<script type="text/babel" src="card-art.jsx"></script>
<script type="text/babel" src="screens-onboarding.jsx"></script>
<script type="text/babel" src="screens-home-tarot.jsx"></script>
<script type="text/babel" src="screens-chat-diary.jsx"></script>
<script type="text/babel" src="screens-profile.jsx"></script>
<script type="text/babel" src="screens-altar.jsx"></script>
<script type="text/babel" src="modals.jsx"></script>
<script type="text/babel" src="app.jsx"></script>

<script type="text/babel">
  function Root() {
    const Frame = window.AndroidDevice;
    if (!Frame) return null;
    return (
      <Frame width={420} height={880} dark={true}>
        <div id="app-host" style={{ position: 'relative', width: '100%', height: '100%', background: 'var(--bg-deep)', overflow: 'hidden' }}/>
      </Frame>
    );
  }
  function TaroTweaksUI() {
    const [t, setTweak] = window.useTweaks(window.TWEAK_DEFAULTS);
    const TP = window.TweaksPanel;
    if (!TP) return null;
    return (
      <TP title="Tweaks">
        <window.TweakSection title="Aesthetic">
          <window.TweakRadio label="Background" value={t.darkness} onChange={v => setTweak({
              darkness: v,
              bgDeep: v === 'deep' ? '#0a0618' : v === 'midnight' ? '#0e0a26' : '#1d0e2a',
              bgCard: v === 'deep' ? '#1a1430' : v === 'midnight' ? '#1c1740' : '#2a1840',
            })} options={['deep','midnight','plum']}/>
          <window.TweakColor label="Accent" value={t.gold} onChange={v => setTweak({ gold: v })}
            options={['#d4a64f','#a87fd6','#d97a99','#7fc6f5']}/>
          <window.TweakSelect label="Card backs" value={t.cardStyle} onChange={v => setTweak({ cardStyle: v })}
            options={['ornate','geometric','occult']}/>
          <window.TweakSlider label="Font scale" value={t.fontScale} onChange={v => setTweak({ fontScale: v })}
            min={0.85} max={1.2} step={0.05}/>
        </window.TweakSection>
      </TP>
    );
  }

  function boot() {
    const need = ['AndroidDevice','useTweaks','Icon','TaroData','TaroAtoms','TaroOnboarding','TaroHomeTarot','TaroChatDiary','TaroProfile','TaroAltar','TaroModals','TaroApp'];
    if (!need.every(n => window[n])) return setTimeout(boot, 60);
    ReactDOM.createRoot(document.getElementById('phone-wrap')).render(<Root/>);
    setTimeout(() => {
      const host = document.getElementById('app-host');
      if (!host) return setTimeout(boot, 60);
      ReactDOM.createRoot(host).render(<window.TaroApp/>);
      const tw = document.createElement('div');
      document.body.appendChild(tw);
      ReactDOM.createRoot(tw).render(<TaroTweaksUI/>);
      window.scaleStage();
    }, 80);
  }
  boot();
</script>

</body>
</html>
